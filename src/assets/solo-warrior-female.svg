<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-labelledby="title desc">
  <title id="title">Guerreira cibernética feminina original do SOLO</title>
  <desc id="desc">Figura atlética frontal com armadura tecnológica, visor e silhueta de energia.</desc>
  <defs>
    <linearGradient id="female-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17293a"/>
      <stop offset="0.5" stop-color="#08121f"/>
      <stop offset="1" stop-color="#210c27"/>
    </linearGradient>
    <linearGradient id="female-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#344b60"/>
      <stop offset="0.55" stop-color="#131f2e"/>
      <stop offset="1" stop-color="#080e19"/>
    </linearGradient>
    <linearGradient id="female-energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#26eaff"/>
      <stop offset="0.5" stop-color="#b9fbff"/>
      <stop offset="1" stop-color="#ff3ab6"/>
    </linearGradient>
    <filter id="female-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-labelledby="title desc">
  <title id="title">Guerreiro cibernético masculino original do SOLO</title>
  <desc id="desc">Figura atlética frontal com armadura tecnológica, máscara e silhueta de energia.</desc>
  <defs>
    <linearGradient id="male-shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142536"/>
      <stop offset="0.48" stop-color="#07111e"/>
      <stop offset="1" stop-color="#180d24"/>
    </linearGradient>
    <linearGradient id="male-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#31475d"/>
      <stop offset="0.55" stop-color="#111d2c"/>
      <stop offset="1" stop-color="#080d18"/>
    </linearGradient>
    <linearGradient id="male-energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#24e8ff"/>
      <stop offset="0.52" stop-color="#9ff7ff"/>
      <stop offset="1" stop-color="#ff3fb4"/>
    </linearGradient>
    <filter id="male-glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

